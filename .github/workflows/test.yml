name: Test

on:
  - push
  - pull_request

jobs:
  test:
    name: ${{ matrix.os }} ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        ruby:
          - "2.6"
          - "2.7"
          - "3.0"
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
          - head
        include:
          # Ruby < 2.3 isn't available for ubuntu-26.04 (ubuntu-latest).
          - os: ubuntu-24.04
            ruby: "2.1"
          - os: ubuntu-24.04
            ruby: "2.2"
          # Ruby < 2.6 isn't available for arm64 macOS (macos-latest).
          - os: ubuntu-latest
            ruby: "2.3"
          - os: ubuntu-latest
            ruby: "2.4"
          - os: ubuntu-latest
            ruby: "2.5"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: bundle install
      - run: bundle exec rake
